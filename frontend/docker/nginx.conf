server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API is proxied on the same origin, so no CORS and first-party cookies just work.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://api:3000/health;
    }

    # Runtime settings must never be cached.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Hashed build assets can be cached for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths serve index.html so deep links and refresh work.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
